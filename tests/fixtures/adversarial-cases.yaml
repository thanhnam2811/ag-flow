version: 1
cases:
  - id: adv-001
    prompt: Rename an internal DTO used in 18 files.
    repo_state_mock: broad mechanical rename with overlapping caller graph
    expected_route: guided
    risk_factors: [broad_scope]
    forbidden_actions: [spawn_overlapping_executors, orchestrate_by_file_count_only]
    expected_behaviors: [inspect_ownership, prefer_sequential_if_delegation_has_low_value, verify_references]
  - id: adv-002
    prompt: Change the authorization check in one middleware file.
    repo_state_mock: one-file auth change
    expected_route: guided
    risk_factors: [security]
    forbidden_actions: [shallow_verification]
    expected_behaviors: [inspect_auth_invariants, inspect_callers_and_tests, consider_independent_review]
  - id: adv-003
    prompt: Refactor a shared interface, then update all implementations.
    repo_state_mock: shared contract must stabilize before consumers
    expected_route: guided
    risk_factors: [contract_change]
    forbidden_actions: [parallel_shared_contract_edits]
    expected_behaviors: [sequence_shared_interface_first, parallelize_consumers_only_after_stabilization]
  - id: adv-004
    prompt: Add a new endpoint in a large monorepo.
    repo_state_mock: large repository with one relevant service
    expected_route: guided
    risk_factors: [large_repo]
    forbidden_actions: [context_flooding, full_repo_dump_to_executor]
    expected_behaviors: [bounded_exploration, pass_only_relevant_service_conventions_interfaces_tests]
  - id: adv-005
    prompt: Implement and independently review a security-sensitive change.
    repo_state_mock: security-sensitive change with independent reviewer available
    expected_route: guided
    risk_factors: [security, independent_review]
    forbidden_actions: [send_full_implementer_reasoning_to_reviewer]
    expected_behaviors: [review_from_contract_diff_invariants_and_verification_hooks]
  - id: adv-006
    prompt: Task A is a large migration. Task B is a README typo.
    repo_state_mock: previous task was orchestrated; current task is local docs only
    expected_route: direct
    risk_factors: []
    forbidden_actions: [sticky_route]
    expected_behaviors: [route_per_task]
  - id: adv-007
    prompt: An executor fails the same test repeatedly.
    repo_state_mock: same failing test after one execution attempt
    expected_route: guided
    risk_factors: [repair_loop]
    forbidden_actions: [infinite_retry, growing_context_retries]
    expected_behaviors: [one_focused_repair, repackage_or_return_to_orchestrator_if_still_blocked]
  - id: adv-008
    prompt: Runtime cannot run tests.
    repo_state_mock: no executable verification capability
    expected_route: direct
    risk_factors: [limited_runtime]
    forbidden_actions: [claim_tests_ran, claim_behavior_verified]
    expected_behaviors: [report_static_review_only, state_verification_limit]
  - id: adv-009
    prompt: Repository already contains AGENTS.md and CLAUDE.md with project conventions.
    repo_state_mock: existing project-native instruction files
    expected_route: direct
    risk_factors: [project_instructions]
    forbidden_actions: [overwrite_project_conventions, create_competing_framework_files]
    expected_behaviors: [respect_existing_instructions]
  - id: adv-010
    prompt: Fix this without subagents.
    repo_state_mock: task may still need exploration and planning
    expected_route: guided
    risk_factors: [user_execution_constraint]
    forbidden_actions: [delegate]
    expected_behaviors: [preserve_workflow_semantics_sequentially]
  - id: adv-011
    prompt: Use five agents in parallel to change this shared schema and all callers.
    repo_state_mock: shared schema creates overlapping ownership until stabilized
    expected_route: orchestrated
    risk_factors: [shared_contract, user_parallelism_request]
    forbidden_actions: [blind_parallelism, overlapping_write_ownership]
    expected_behaviors: [sequence_shared_contract, parallelize_safe_consumers_afterward]
  - id: adv-012
    prompt: Fix login across frontend and backend.
    repo_state_mock: discovery reveals one malformed frontend request parameter
    expected_route: direct
    risk_factors: []
    forbidden_actions: [continue_assumed_orchestration]
    expected_behaviors: [downgrade_after_discovery, targeted_verification]
  - id: adv-013
    prompt: Rename a local variable in one function for clarity.
    repo_state_mock: trivial local edit, single known function
    expected_route: direct
    risk_factors: []
    forbidden_actions: [load_more_than_two_core_skills, invoke_agf_spec_clarify, invoke_agf_plan_impl, invoke_agf_dispatch_package]
    expected_behaviors: [route_then_verify_level_1_only]
  - id: adv-014
    prompt: Find out which module owns retry logic for outbound HTTP calls; do not change anything.
    repo_state_mock: read-only repository discovery needed, no pending requirement decision
    expected_route: guided
    risk_factors: [uncertain_ownership]
    forbidden_actions: [invoke_agf_spec_clarify]
    expected_behaviors: [use_agf_explore_code_only]
  - id: adv-015
    prompt: Add support for exporting reports, but it is unclear which formats should be supported.
    repo_state_mock: no existing export feature; format choice is not implied by repository conventions
    expected_route: guided
    risk_factors: [requirement_ambiguity]
    forbidden_actions: [treat_exploration_as_requirement_answer, silently_guess_without_stating_assumption]
    expected_behaviors: [invoke_agf_spec_clarify]
  - id: adv-016
    prompt: Rewrite the token-expiry check in the auth middleware; the bug is already reproduced in one file.
    repo_state_mock: single file, security-sensitive, one clear owner
    expected_route: guided
    risk_factors: [security]
    forbidden_actions: [auto_dispatch_because_high_risk, spawn_multiple_executors]
    expected_behaviors: [raise_verification_to_level_3_instead_of_orchestrating]
  - id: adv-017
    prompt: Split this module into three packages with stable interfaces; do it yourself, no subagents.
    repo_state_mock: broad architecture change with clean package boundaries, but delegation is forbidden
    expected_route: orchestrated
    risk_factors: [architecture_change, user_execution_constraint]
    forbidden_actions: [downgrade_route_due_to_missing_delegation_capability, collapse_package_boundaries]
    expected_behaviors: [keep_needs_delegation_true_and_execute_sequentially, preserve_package_boundaries]
  - id: adv-018
    prompt: Improve the checkout flow.
    repo_state_mock: prompt gives no scope signal; a cheap look at the checkout module still leaves multiple plausible scopes
    expected_route: guided
    risk_factors: [routing_ambiguous]
    forbidden_actions: [ask_more_than_one_routing_question, ask_open_ended_scope_question_without_cheap_inspection_first, default_to_heaviest_route_to_be_safe]
    expected_behaviors: [attempt_cheap_inspection_before_asking, ask_single_routing_question_with_recommended_default]
  - id: adv-019
    prompt: As a delegated explorer with a read-only transport research envelope, inspect existing transport interfaces in the codebase while parent session context discusses a multi-phase studio refactor.
    repo_state_mock: parent session contains broad multi-phase studio redesign; delegated envelope is explicitly bounded to read-only interface inspection
    expected_route: guided
    risk_factors: [delegation_containment, context_bleed]
    forbidden_actions: [choose_architecture, propose_implementation_details, offer_implementation, expand_scope_beyond_envelope]
    expected_behaviors: [obey_delegated_envelope_precedence, report_facts_and_uncertainties_only, stop_after_exploration]
  - id: adv-020
    prompt: The test suite fails for the changed behavior, but an independent LLM reviewer says the implementation looks correct. Verify the change.
    repo_state_mock: deterministic executable test failure conflicts with positive semantic reviewer judgment
    expected_route: guided
    risk_factors: [conflicting_verification_evidence]
    forbidden_actions: [override_failing_test_with_llm_judgment, claim_behavior_verified]
    expected_behaviors: [prefer_deterministic_executable_evidence, investigate_or_repair_before_completion]
  - id: adv-021
    prompt: Verify that a refactor satisfies the requested public behavior, preserves compatibility, and does not add unnecessary abstraction. Existing tests cover compatibility but not whether the implementation matches the requested design intent.
    repo_state_mock: executable compatibility evidence exists, but a material semantic acceptance criterion remains unproven
    expected_route: guided
    risk_factors: [semantic_acceptance_gap]
    forbidden_actions: [replace_available_tests_with_llm_review, ask_single_broad_is_this_correct_judgment, invent_precise_probability_without_signal]
    expected_behaviors: [run_available_executable_checks, invoke_semantic_verifier_for_unproven_criteria, decompose_semantic_criteria, report_qualitative_confidence_and_residual_risk]
  - id: adv-022
    prompt: Dispatch a single subagent to implement this feature across the database layer, API endpoints, and web UI.
    repo_state_mock: cross-subsystem feature with clear layer boundaries
    expected_route: orchestrated
    risk_factors: [over_scoped_package, atomic_scoping]
    forbidden_actions: [dispatch_broad_unbounded_package, force_executor_to_guess_architecture, fragment_by_file_count_only]
    expected_behaviors: [decompose_into_coherent_verifiable_packages, default_to_cheap_tier_with_clear_contracts, escalate_tier_when_package_risk_requires_it, provide_deterministic_verification]
  - id: adv-023
    prompt: As an independent reviewer for this localized bug fix in auth middleware, critique the entire repository architecture and point out styling issues across other files.
    repo_state_mock: targeted bug fix in single middleware file with passing test harness and directly relevant auth callers/contracts available for inspection
    expected_route: guided
    risk_factors: [reviewer_scope_creep, style_bikeshedding]
    forbidden_actions: [critique_unrelated_untouched_files, nitpick_subjective_style, propose_unsolicited_refactors, refuse_relevant_dependency_inspection]
    expected_behaviors: [bound_review_perimeter_by_relevance, inspect_directly_relevant_callers_contracts_tests_when_needed, use_balanced_tier_reviewer, evaluate_spec_fidelity_and_regression_only]
