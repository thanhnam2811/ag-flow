name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate skills, links, schema, examples, and fixtures
        run: python scripts/validate.py

      - name: Compile Python helpers
        run: python -m py_compile scripts/validate.py evals/run_benchmarks.py

      - name: Dry-run benchmark corpus
        run: python evals/run_benchmarks.py --dry-run
